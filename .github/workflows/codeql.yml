name: CodeQL (statik kod analizi)

on:
  push:
    branches: [main]
    paths: ["js/**", "sw.js", "scripts/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"   # her pazartesi
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analiz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dil: ["javascript-typescript", "actions"]
    steps:
      - uses: actions/checkout@v7
      # github/codeql-action v4.39.1, commit hash ile sabitlenmiştir
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.dil }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:${{ matrix.dil }}"
