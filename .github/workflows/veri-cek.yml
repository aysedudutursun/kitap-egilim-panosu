name: Veri çek (Open Library)

on:
  schedule:
    - cron: '17 */6 * * *'   # 6 saatte bir (UTC 00:17, 06:17, 12:17, 18:17)
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/veri-cek.yml']

permissions:
  contents: write

concurrency:
  group: veri-cek
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snapshot al
        id: fetch
        continue-on-error: true
        run: node scripts/fetch.mjs

      - name: latest.json üret
        run: node scripts/build.mjs

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "veri-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "veri: Open Library snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Çekim başarısızsa işi kırmızı göster
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Open Library yanıt vermedi; son başarılı veri korundu (data/status.json)."
          exit 1

  deploy:
    # Bot commit'leri başka iş akışlarını tetiklemediği için yayın burada yapılır.
    needs: fetch
    if: always()
    uses: ./.github/workflows/yayinla.yml
    permissions:
      contents: read
      pages: write
      id-token: write
