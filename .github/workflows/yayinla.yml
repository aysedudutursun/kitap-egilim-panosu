name: Yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # veri commit'i dahil en güncel hâl
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          cp -r index.html vaka-calismasi.html manifest.webmanifest sw.js css js fonts vendor icons data docs _site/
          rm -rf _site/data/snapshots   # ham snapshot'lar depoda kalır, siteye gerekmez
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
