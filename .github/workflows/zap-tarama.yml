name: Güvenlik taraması (OWASP ZAP baseline)

# Elle başlatılır: "önce" ve "sonra" taramaları aynı ayarlarla, sadece etiket değiştirilerek çalıştırılır.
# Raporlar kanıt olarak docs/guvenlik/zap-<etiket>/ klasörüne commit'lenir.
on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Taranacak adres"
        required: true
        default: "https://aysedudutursun.github.io/kitap-egilim-panosu/"
      etiket:
        description: "Rapor etiketi (ör. once, sonra)"
        required: true
        default: "once"

permissions:
  contents: write

concurrency:
  group: zap-tarama
  cancel-in-progress: false

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline taraması
        # v0.15.0 sürümüne commit hash ile sabitlenmiştir (tedarik zinciri saldırısına karşı)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ inputs.hedef }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-${{ inputs.etiket }}
      - name: Raporları depoya kaydet
        env:
          ETIKET: ${{ inputs.etiket }}
          HEDEF: ${{ inputs.hedef }}
        run: |
          case "$ETIKET" in *[!a-z0-9-]*|"") echo "Geçersiz etiket"; exit 1;; esac
          DIR="docs/guvenlik/zap-$ETIKET"
          mkdir -p "$DIR"
          for f in report_html.html report_md.md report_json.json; do
            [ -f "$f" ] && cp "$f" "$DIR/"
          done
          printf 'hedef: %s\ntarama_utc: %s\ncalistirma: %s/%s/actions/runs/%s\n' \
            "$HEDEF" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$DIR/bilgi.txt"
          git config user.name "guvenlik-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          git commit -m "docs(güvenlik): ZAP baseline raporu ($ETIKET)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
